<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#03040d"
    >

    <title>For You, With Love ♡</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<main class="scene" id="scene">

    <!-- =========================
         LANGIT
    ========================== -->

    <div class="sky-glow"></div>

    <div
        class="stars"
        id="stars">
    </div>

    <div class="moon"></div>


    <!-- =========================
         PEMBUKAAN
    ========================== -->

    <section
        class="opening"
        id="opening"
    >

        <p class="tap-label">
            TAP TO OPEN
        </p>


        <button
            class="heart-button"
            id="heartButton"
            aria-label="Buka kejutan"
        >

            <span class="heart-shine"></span>

        </button>


        <p class="opening-hint">
            a little surprise for my love ♡
        </p>

    </section>



    <!-- =========================
         TAMAN BUNGA
    ========================== -->

    <section
        class="garden"
        id="garden"
        aria-hidden="true"
    >

        <!-- Tulisan romantis -->

        <div
            class="romantic-message"
            id="romanticMessage"
        >

            <span>
                For the most special person in my life ♡
            </span>

            <strong>
                kamu membuat dunia terasa lebih indah. ♡
            </strong>

        </div>


        <!-- Cahaya tanah -->

        <div class="ground-glow"></div>


        <!-- Tanah -->

        <div class="ground"></div>


        <!-- Rumput -->

        <div class="grass grass-1"></div>

        <div class="grass grass-2"></div>

        <div class="grass grass-3"></div>

        <div class="grass grass-4"></div>

        <div class="grass grass-5"></div>


        <!-- Bunga -->

        <div
            class="flowers"
            id="flowers"
        ></div>


        <!-- Partikel -->

        <div
            class="particles"
            id="particles"
        ></div>

    </section>



    <!-- =========================
         SURAT / AMPLOP
    ========================== -->

    <section
        class="letter-scene"
        id="letterScene"
        aria-hidden="true"
    >

        <div class="letter-hint">
            Ada sesuatu untukmu... ♡
        </div>


        <button
            class="envelope"
            id="envelope"
            aria-label="Buka surat"
        >

            <span class="envelope-paper"></span>

            <span class="envelope-front"></span>

            <span class="envelope-flap"></span>

            <span class="wax-heart">
                ♥
            </span>

        </button>

    </section>



    <!-- =========================
         ISI SURAT
    ========================== -->

    <div
        class="letter-modal"
        id="letterModal"
        aria-hidden="true"
    >

        <div class="modal-backdrop"></div>


        <article class="love-letter">

            <button
                class="close-letter"
                id="closeLetter"
                aria-label="Tutup surat"
            >
                ×
            </button>


            <div class="letter-decoration">
                ♡
            </div>


            <p class="letter-small">
                A little letter for
            </p>


            <h1>
                MY GIRLFRIEND ♡
            </h1>


            <div class="letter-line"></div>


            <p
                class="letter-text"
                id="letterText"
            ></p>


            <p class="signature">

                From your love

                <br>

                <span>
                    ♡
                </span>

            </p>

        </article>

    </div>



    <!-- =========================
         TOMBOL ULANG
    ========================== -->

    <button
        class="replay"
        id="replay"
        aria-label="Ulangi animasi"
    >
        ↻
    </button>


</main>


<script src="script.js"></script>

</body>

</html>
