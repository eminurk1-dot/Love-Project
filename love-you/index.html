<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I Have Something</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HALAMAN PERTAMA -->
    <div class="page page1" id="page1">

        <h1 id="introText"></h1>

        <button id="openBtn">
            ✨ Open
        </button>

    </div>


    <!-- HALAMAN KEDUA -->
    <div class="page page2 hidden" id="page2">

        <!-- Emoji love -->
        <div class="love-container" id="loveContainer"></div>

        <!-- Tulisan I LOVE YOU -->
        <h1 id="loveText"></h1>

        <!-- Pesan -->
        <p id="smallText">
            A little message, just for you ♡
            <br><br>
            Dunia ini rasanya jauh lebih baik kalau kamu bahagia.
            <br>
            So, please continue to smile and be happy every day, okay? ♡♡
        </p>

        <!-- Tempat bunga -->
        <div class="garden" id="garden"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
